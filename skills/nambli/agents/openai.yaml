interface:
  display_name: "nambli"
  icon_small: "./assets/icon.png"
  icon_large: "./assets/logo.png"
  short_description: "Manage your connected calendar on explicit request"
  default_prompt: "Use $nambli to show today's events in my connected account."
dependencies:
  tools:
    - type: "mcp"
      value: "nambli"
      description: "Account-scoped nambli tools"
      transport: "streamable_http"
      url: "https://nambli.com/mcp"
policy:
  allow_implicit_invocation: false
